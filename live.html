<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StreamPulse Live Stream Rooms</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script>tailwind.config={theme:{extend:{colors:{brand:{500:'#6366f1',600:'#4f46e5'}}}}}</script>
  <style>
    body{background:radial-gradient(circle at top,#172554 0,#020617 42%);min-height:100vh}.glass{background:rgba(15,23,42,.86);backdrop-filter:blur(14px)}
    .scroll::-webkit-scrollbar{width:7px}.scroll::-webkit-scrollbar-thumb{background:#334155;border-radius:99px}
  </style>
</head>
<body class="text-slate-100">
  <header class="sticky top-0 z-40 glass border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 min-h-16 py-2 flex flex-wrap items-center justify-between gap-3">
      <a href="index.html" class="flex items-center gap-3"><span class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-fuchsia-600 grid place-items-center"><i class="fa-solid fa-tower-broadcast"></i></span><span><b class="text-xl">StreamPulse Live</b><small class="block text-slate-400">直播房與多使用者聊天室</small></span></a>
      <nav class="flex gap-2 text-xs"><a href="index.html" class="px-3 py-2 rounded-xl bg-slate-800">影音大廳</a><button onclick="openModal('profileModal')" class="px-3 py-2 rounded-xl bg-slate-800"><i class="fa-solid fa-user-pen mr-1"></i>暱稱 / Avatar</button><button onclick="openModal('walletModal')" class="px-3 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold"><i class="fa-solid fa-coins mr-1"></i><span id="top-points">0</span></button></nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
    <section class="glass border border-slate-800 rounded-3xl p-6 flex flex-col lg:flex-row gap-5 justify-between lg:items-center">
      <div><span class="text-xs text-fuchsia-300 font-bold tracking-widest">LIVE COMMUNITY</span><h1 class="text-3xl font-black mt-2">建立或加入 Live Stream Room</h1><p class="text-slate-400 mt-2">每個房間都有獨立聊天室、追蹤、訂閱、點數圖示及贊助留言。</p></div>
      <button onclick="openModal('roomModal')" class="shrink-0 px-5 py-3 rounded-2xl bg-gradient-to-r from-brand-600 to-fuchsia-600 font-bold"><i class="fa-solid fa-plus mr-2"></i>創建直播房</button>
    </section>

    <section><div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold"><i class="fa-solid fa-satellite-dish text-rose-400 mr-2"></i>Live Rooms</h2><input id="room-search" oninput="renderRooms()" placeholder="搜尋房間或主持人" class="w-56 max-w-[48%] bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm"></div><div id="room-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div></section>

    <section id="active-room" class="hidden glass border border-brand-500/40 rounded-3xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3"><div class="flex items-center gap-3"><span class="px-2 py-1 rounded-lg bg-rose-500 text-xs font-black animate-pulse">LIVE</span><div><h2 id="active-title" class="font-bold"></h2><p id="active-host" class="text-xs text-slate-400"></p></div></div><div class="flex gap-2"><button id="follow-btn" onclick="toggleFollow()" class="px-3 py-2 rounded-xl bg-slate-800 text-xs"></button><button id="subscribe-btn" onclick="toggleSubscribe()" class="px-3 py-2 rounded-xl bg-fuchsia-600 text-xs font-bold"></button><button onclick="shareRoom()" class="px-3 py-2 rounded-xl bg-cyan-700 text-xs"><i class="fa-solid fa-share-nodes"></i></button><button onclick="leaveRoom()" class="px-3 py-2 rounded-xl bg-slate-800 text-xs">離開</button></div></div>
      <div class="grid lg:grid-cols-[1.5fr_1fr] min-h-[600px]">
        <div class="p-4 border-b lg:border-b-0 lg:border-r border-slate-800">
          <div class="aspect-video bg-black rounded-2xl overflow-hidden grid place-items-center"><video id="live-video" controls autoplay playsinline controlsList="nodownload noplaybackrate" disablePictureInPicture oncontextmenu="return false" class="w-full h-full object-contain hidden"></video><div id="stream-placeholder" class="text-center text-slate-500"><i class="fa-solid fa-tower-broadcast text-5xl mb-3"></i><p>此房間尚未設定直播網址</p></div></div>
          <div class="mt-4"><p id="active-desc" class="text-sm text-slate-300"></p><div class="mt-3 flex gap-3 text-xs text-slate-400"><span id="active-domain"></span><span id="active-followers"></span><span id="active-subscribers"></span></div></div>
        </div>
        <div class="flex flex-col min-h-[600px] max-h-[720px]">
          <div class="p-3 border-b border-slate-800 flex items-center justify-between"><b>Room Chat Board</b><button onclick="openModal('iconModal')" class="px-3 py-1.5 bg-violet-600 rounded-lg text-xs"><i class="fa-solid fa-icons mr-1"></i>圖示商店</button></div>
          <div id="chat-list" class="scroll flex-1 overflow-y-auto p-3 space-y-3"></div>
          <div id="owned-icons" class="p-2 border-t border-slate-800 flex gap-2 overflow-x-auto"></div>
          <form onsubmit="sendMessage(event)" class="p-3 border-t border-slate-800 flex gap-2">
            <!-- 正常用戶看不到，但機器人爬蟲會自動填寫 -->
            <input name="honeypot_field" style="display:none!important" tabindex="-1" autocomplete="off" aria-hidden="true">
            <input id="chat-input" maxlength="500" required placeholder="輸入訊息…" class="flex-1 min-w-0 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2"><button class="w-11 rounded-xl bg-brand-600"><i class="fa-solid fa-paper-plane"></i></button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="profileModal" class="modal hidden fixed inset-0 z-50 bg-black/80 p-4 grid place-items-center"><div class="glass border border-slate-700 rounded-3xl p-6 w-full max-w-md"><div class="flex justify-between"><h3 class="text-xl font-bold">個人聊天室資料</h3><button onclick="closeModal('profileModal')">✕</button></div><form onsubmit="saveProfile(event)" class="mt-5 space-y-4"><input id="nickname" maxlength="30" required placeholder="暱稱" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3"><input id="avatar-url" type="url" placeholder="Avatar 圖片 URL（可留空）" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3"><label class="block text-sm text-slate-400">或從電腦上傳 Avatar（最大 800KB）<input id="avatar-file" type="file" accept="image/*" class="block w-full mt-2"></label><button class="w-full py-3 rounded-xl bg-brand-600 font-bold">儲存資料</button></form></div></div>

  <div id="roomModal" class="modal hidden fixed inset-0 z-50 bg-black/80 p-4 grid place-items-center"><div class="glass border border-slate-700 rounded-3xl p-6 w-full max-w-lg"><div class="flex justify-between"><h3 class="text-xl font-bold">創建 Live Stream Room</h3><button onclick="closeModal('roomModal')">✕</button></div><form onsubmit="createRoom(event)" class="mt-5 grid gap-3"><input id="room-title" maxlength="60" required placeholder="直播房名稱" class="bg-slate-950 border border-slate-700 rounded-xl p-3"><input id="room-host" maxlength="30" placeholder="主持人（空白使用目前暱稱）" class="bg-slate-950 border border-slate-700 rounded-xl p-3"><input id="room-domain" maxlength="80" placeholder="Room Domain／分類，例如 music.stream" class="bg-slate-950 border border-slate-700 rounded-xl p-3"><input id="room-stream" type="url" placeholder="公開 HTTPS MP4/WebM/HLS 網址（可留空）" class="bg-slate-950 border border-slate-700 rounded-xl p-3"><textarea id="room-description" maxlength="300" placeholder="房間介紹" class="bg-slate-950 border border-slate-700 rounded-xl p-3"></textarea><button class="py-3 rounded-xl bg-gradient-to-r from-brand-600 to-fuchsia-600 font-bold">建立房間</button></form></div></div>

  <div id="walletModal" class="modal hidden fixed inset-0 z-50 bg-black/80 p-4 grid place-items-center"><div class="glass border border-slate-700 rounded-3xl p-6 w-full max-w-lg"><div class="flex justify-between"><h3 class="text-xl font-bold">購買 Points</h3><button onclick="closeModal('walletModal')">✕</button></div><p class="mt-2 text-amber-300 text-xs">測試模式：尚未連接 Google Play／Stripe，按鈕不會真正扣款。</p><div id="point-packs" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-5"></div></div></div>

  <div id="iconModal" class="modal hidden fixed inset-0 z-50 bg-black/80 p-4 grid place-items-center"><div class="glass border border-slate-700 rounded-3xl p-6 w-full max-w-2xl max-h-[90vh] overflow-auto"><div class="flex justify-between"><h3 class="text-xl font-bold">Cute Icons 商店與贊助</h3><button onclick="closeModal('iconModal')">✕</button></div><div id="icon-shop" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-5"></div><hr class="border-slate-700 my-5"><h4 class="font-bold">加入自訂圖示</h4><div class="grid sm:grid-cols-2 gap-3 mt-3"><input id="custom-icon-url" type="url" placeholder="圖片 URL" class="bg-slate-950 border border-slate-700 rounded-xl p-3"><input id="custom-icon-file" type="file" accept="image/*" class="bg-slate-950 border border-slate-700 rounded-xl p-3"></div><button onclick="addCustomIcon()" class="mt-3 px-4 py-2 rounded-xl bg-cyan-700">加入自訂圖示（300 Points）</button></div></div>

  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 translate-y-24 opacity-0 transition-all z-[60] px-4 py-3 rounded-xl bg-slate-800 border border-slate-600 text-sm"></div>

<script>
const KEYS={rooms:'sp_live_rooms_v1',profile:'sp_live_profile_v1',points:'sp_live_points_v1',owned:'sp_live_icons_v1',follows:'sp_live_follows_v1',subs:'sp_live_subscriptions_v1'};
const packs=[100,300,600,1000,10000];
const shop=[{id:'bunny',icon:'🐰',cost:100},{id:'cat',icon:'😺',cost:100},{id:'heart',icon:'💖',cost:300},{id:'star',icon:'🌟',cost:300},{id:'unicorn',icon:'🦄',cost:600},{id:'crown',icon:'👑',cost:1000},{id:'rocket',icon:'🚀',cost:1000},{id:'diamond',icon:'💎',cost:10000}];
const defaults=[{id:'welcome-room',title:'StreamPulse Welcome Live',host:'StreamPulse',domain:'community.stream',description:'歡迎測試直播房、聊天、圖示贊助、追蹤與訂閱功能。',stream:'',createdAt:new Date().toISOString()}];
let rooms=load(KEYS.rooms,defaults),profile=load(KEYS.profile,{nickname:'Guest',avatar:''}),points=Number(localStorage.getItem(KEYS.points)||300),owned=load(KEYS.owned,['bunny']),follows=load(KEYS.follows,[]),subs=load(KEYS.subs,[]),activeRoomId='',selectedIcon='',activeHls=null;
const channel=('BroadcastChannel'in window)?new BroadcastChannel('streampulse-live-v1'):null;
function load(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}}
function save(key,value){localStorage.setItem(key,JSON.stringify(value))}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function safeUrl(v){try{const u=new URL(v);return u.protocol==='https:'?u.href:''}catch{return''}}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.remove('translate-y-24','opacity-0');setTimeout(()=>el.classList.add('translate-y-24','opacity-0'),2600)}
function openModal(id){document.getElementById(id).classList.remove('hidden')}function closeModal(id){document.getElementById(id).classList.add('hidden')}
function updatePoints(){document.getElementById('top-points').textContent=points.toLocaleString();localStorage.setItem(KEYS.points,String(points))}
function roomMessagesKey(id){return`sp_live_messages_${id}`}
function renderRooms(){const q=document.getElementById('room-search').value.toLowerCase();const list=rooms.filter(r=>`${r.title} ${r.host} ${r.domain}`.toLowerCase().includes(q));document.getElementById('room-grid').innerHTML=list.map(r=>`<article class="glass border border-slate-800 rounded-2xl overflow-hidden"><div class="aspect-video bg-gradient-to-br from-indigo-900 to-fuchsia-900 grid place-items-center"><i class="fa-solid fa-tower-broadcast text-5xl text-white/70"></i></div><div class="p-4"><div class="flex justify-between gap-3"><h3 class="font-bold">${esc(r.title)}</h3><span class="text-[10px] text-rose-300">● LIVE</span></div><p class="text-xs text-slate-400 mt-1">${esc(r.host)} · ${esc(r.domain||'general.live')}</p><p class="text-sm text-slate-300 mt-3 line-clamp-2">${esc(r.description||'')}</p><button onclick="joinRoom('${r.id}')" class="mt-4 w-full py-2 rounded-xl bg-brand-600 font-bold">進入 Room</button></div></article>`).join('')||'<p class="text-slate-500">找不到直播房</p>'}
function createRoom(e){e.preventDefault();const title=document.getElementById('room-title').value.trim(),stream=safeUrl(document.getElementById('room-stream').value.trim());if(document.getElementById('room-stream').value&& !stream)return toast('直播網址必須是 HTTPS');const room={id:`room-${Date.now()}`,title,host:document.getElementById('room-host').value.trim()||profile.nickname,domain:document.getElementById('room-domain').value.trim()||'community.live',stream,description:document.getElementById('room-description').value.trim(),createdAt:new Date().toISOString()};rooms.unshift(room);save(KEYS.rooms,rooms);broadcast('rooms');renderRooms();closeModal('roomModal');e.target.reset();joinRoom(room.id);toast('直播房已建立')}
function joinRoom(id){const r=rooms.find(x=>x.id===id);if(!r)return;activeRoomId=id;document.getElementById('active-room').classList.remove('hidden');document.getElementById('active-title').textContent=r.title;document.getElementById('active-host').textContent=`Host: ${r.host}`;document.getElementById('active-desc').textContent=r.description||'';document.getElementById('active-domain').textContent=`🌐 ${r.domain}`;const video=document.getElementById('live-video'),placeholder=document.getElementById('stream-placeholder');if(activeHls){activeHls.destroy();activeHls=null}if(r.stream){video.classList.remove('hidden');placeholder.classList.add('hidden');if(r.stream.includes('.m3u8')&&window.Hls&&Hls.isSupported()){activeHls=new Hls();activeHls.loadSource(r.stream);activeHls.attachMedia(video)}else video.src=r.stream;video.play().catch(()=>{})}else{video.removeAttribute('src');video.classList.add('hidden');placeholder.classList.remove('hidden')}renderRoomState();renderChat();document.getElementById('active-room').scrollIntoView({behavior:'smooth'})}
function leaveRoom(){document.getElementById('live-video').pause();document.getElementById('active-room').classList.add('hidden');activeRoomId=''}
function renderRoomState(){document.getElementById('follow-btn').innerHTML=follows.includes(activeRoomId)?'✓ 已追蹤':'＋ Follow';document.getElementById('subscribe-btn').innerHTML=subs.includes(activeRoomId)?'✓ 已訂閱':'Subscribe · 300 Points';document.getElementById('active-followers').textContent=`♥ ${follows.includes(activeRoomId)?1:0} Follow`;document.getElementById('active-subscribers').textContent=`★ ${subs.includes(activeRoomId)?1:0} Subscribe`}
function toggleFollow(){const i=follows.indexOf(activeRoomId);i>=0?follows.splice(i,1):follows.push(activeRoomId);save(KEYS.follows,follows);renderRoomState();toast(i>=0?'已取消追蹤':'已追蹤此直播房')}
function toggleSubscribe(){const i=subs.indexOf(activeRoomId);if(i>=0){subs.splice(i,1);toast('已取消訂閱')}else{if(points<300)return toast('Points 不足');points-=300;subs.push(activeRoomId);updatePoints();postSystem(`${profile.nickname} 訂閱了直播房！`)}save(KEYS.subs,subs);renderRoomState()}
function saveProfile(e){e.preventDefault();const file=document.getElementById('avatar-file').files[0],finish=avatar=>{profile={nickname:document.getElementById('nickname').value.trim(),avatar};save(KEYS.profile,profile);closeModal('profileModal');toast('聊天室資料已儲存')};if(file){if(file.size>800*1024)return toast('Avatar 超過 800KB');const rd=new FileReader();rd.onload=()=>finish(String(rd.result));rd.readAsDataURL(file)}else finish(safeUrl(document.getElementById('avatar-url').value.trim())||profile.avatar)}
function messageIconHtml(m){if(!m.icon)return'';if(m.icon.startsWith('data:')||m.icon.startsWith('https:'))return`<img src="${esc(m.icon)}" class="w-10 h-10 object-contain">`;return`<span class="text-3xl">${esc(m.icon)}</span>`}
function renderChat(){if(!activeRoomId)return;const msgs=load(roomMessagesKey(activeRoomId),[]);document.getElementById('chat-list').innerHTML=msgs.map(m=>`<div class="flex gap-2"><div class="w-9 h-9 rounded-full bg-slate-700 shrink-0 overflow-hidden grid place-items-center">${m.avatar?`<img src="${esc(m.avatar)}" class="w-full h-full object-cover">`:'👤'}</div><div class="min-w-0"><div class="text-xs"><b class="text-cyan-300">${esc(m.nickname)}</b> <span class="text-slate-600">${new Date(m.time).toLocaleTimeString()}</span></div><div class="mt-1 text-sm break-words">${messageIconHtml(m)}${esc(m.text)}</div></div></div>`).join('');const list=document.getElementById('chat-list');list.scrollTop=list.scrollHeight;renderOwnedIcons()}
function addMessage(message){const key=roomMessagesKey(activeRoomId),msgs=load(key,[]);msgs.push(message);save(key,msgs.slice(-300));broadcast('message',{roomId:activeRoomId});renderChat()}
function sendMessage(e){e.preventDefault();const hp=e.currentTarget.elements.namedItem('honeypot_field');if(hp&&hp.value.trim())return e.currentTarget.reset();const text=document.getElementById('chat-input').value.trim();if(!text)return;addMessage({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),nickname:profile.nickname,avatar:profile.avatar,text,icon:selectedIcon,time:new Date().toISOString()});selectedIcon='';e.target.reset()}
function postSystem(text,icon=''){addMessage({id:String(Date.now()),nickname:'StreamPulse Bot',avatar:'',text,icon,time:new Date().toISOString()})}
function renderPacks(){document.getElementById('point-packs').innerHTML=packs.map(p=>`<button onclick="buyPoints(${p})" class="p-4 rounded-2xl bg-slate-900 border border-amber-500/30 hover:border-amber-400"><i class="fa-solid fa-coins text-amber-400"></i><b class="block mt-2">${p.toLocaleString()} Points</b><small class="text-slate-500">測試購買</small></button>`).join('')}
function buyPoints(amount){points+=amount;updatePoints();toast(`已加入 ${amount.toLocaleString()} 測試 Points`)}
function renderShop(){document.getElementById('icon-shop').innerHTML=shop.map(i=>`<button onclick="buyOrSupport('${i.id}')" class="p-4 rounded-2xl bg-slate-900 border border-slate-700"><span class="text-4xl">${i.icon}</span><b class="block mt-2">${i.cost.toLocaleString()} Points</b><small class="text-cyan-300">${owned.includes(i.id)?'用於贊助':'購買圖示'}</small></button>`).join('')}
function buyOrSupport(id){const item=shop.find(x=>x.id===id);if(!item)return;if(!owned.includes(id)){if(points<item.cost)return toast('Points 不足');points-=item.cost;owned.push(id);save(KEYS.owned,owned);updatePoints();renderShop();renderOwnedIcons();return toast(`已購買 ${item.icon}`)}if(!activeRoomId)return toast('請先進入直播房');if(points<item.cost)return toast('Points 不足');points-=item.cost;updatePoints();postSystem(`${profile.nickname} 使用 ${item.icon} 贊助房間 ${item.cost} Points！`,item.icon);closeModal('iconModal')}
function renderOwnedIcons(){const customs=owned.filter(x=>typeof x==='object'),standard=owned.filter(x=>typeof x==='string').map(id=>shop.find(i=>i.id===id)).filter(Boolean);document.getElementById('owned-icons').innerHTML=[...standard.map(i=>({value:i.icon,label:i.icon})),...customs.map(i=>({value:i.src,label:`<img src="${esc(i.src)}" class="w-7 h-7 object-contain">`}))].map(i=>`<button onclick='selectIcon(${JSON.stringify(i.value)})' class="w-10 h-10 shrink-0 rounded-lg ${selectedIcon===i.value?'bg-brand-600':'bg-slate-800'} grid place-items-center">${i.label}</button>`).join('')}
function selectIcon(icon){selectedIcon=icon;renderOwnedIcons()}
function addCustomIcon(){if(points<300)return toast('需要 300 Points');const file=document.getElementById('custom-icon-file').files[0],url=safeUrl(document.getElementById('custom-icon-url').value.trim()),finish=src=>{if(!src)return toast('請輸入 HTTPS 圖片 URL 或選擇檔案');points-=300;owned.push({id:`custom-${Date.now()}`,src});save(KEYS.owned,owned);updatePoints();renderOwnedIcons();toast('自訂圖示已加入')};if(file){if(file.size>256*1024)return toast('自訂圖示超過 256KB');const rd=new FileReader();rd.onload=()=>finish(String(rd.result));rd.readAsDataURL(file)}else finish(url)}
async function shareRoom(){const room=rooms.find(r=>r.id===activeRoomId);if(!room)return;const url=new URL(location.href);url.searchParams.set('room',room.id);try{if(navigator.share)await navigator.share({title:room.title,text:`加入 ${room.title}`,url:url.href});else{await navigator.clipboard.writeText(url.href);toast('Room 分享連結已複製')}}catch(e){if(e.name!=='AbortError')toast('分享失敗')}}
function broadcast(type,data={}){if(channel)channel.postMessage({type,...data});localStorage.setItem('sp_live_signal',JSON.stringify({type,...data,time:Date.now()}))}
function receive(data){if(data.type==='rooms'){rooms=load(KEYS.rooms,defaults);renderRooms()}if(data.type==='message'&&data.roomId===activeRoomId)renderChat()}
if(channel)channel.onmessage=e=>receive(e.data);window.addEventListener('storage',e=>{if(e.key==='sp_live_signal'&&e.newValue)receive(JSON.parse(e.newValue))});
document.addEventListener('contextmenu',e=>{if(e.target.closest('video,audio'))e.preventDefault()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s')e.preventDefault()});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('nickname').value=profile.nickname;document.getElementById('avatar-url').value=profile.avatar.startsWith('https:')?profile.avatar:'';updatePoints();renderPacks();renderShop();renderRooms();renderOwnedIcons();const room=new URLSearchParams(location.search).get('room');if(room)joinRoom(room)});
</script>
</body>
</html>
